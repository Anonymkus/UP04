<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Барбершоп — записи клиентов, барберы, услуги">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Барбершоп</title>
  <style>
    body { margin: 0; background: #fdf7ff; }
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: Roboto, Arial, sans-serif; color: #1d1b20;
    }
    #splash h1 { font-size: 28px; font-weight: 500; margin: 0 0 24px; }
    #splash .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid #e8def8; border-top-color: #6750a4;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <h1>Барбершоп</h1>
    <div class="spinner"></div>
    <p>Загрузка приложения…</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
